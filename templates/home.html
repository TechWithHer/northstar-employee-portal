{% extends "base.html" %}

{% block title %}
Home | Northstar Employee Records Portal
{% endblock %}


{% block content %}

<h2>Employee Search</h2>

<p>Search for an employee using their Employee ID.</p>

<form method="GET" action="/">

    <label for="employee_id">Employee ID</label>

    <input
        type="number"
        id="employee_id"
        name="employee_id"
        required
    >

    <button type="submit">
        Search Employee
    </button>

</form>

{% endblock %}
